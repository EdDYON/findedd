# Site 
title: EdDYON的小窝 # 你的网站主标题
subtitle: '最爱蛋炒饭之人' # 副标题
description: '记录自己' # 网站描述，有利于被搜索引擎收录
keywords: 'Minecraft, Mod, EdDYON' 
author: EdDYON 
language: 
  - zh-CN
  - en timezone: 'Asia/Shanghai' 

# URL 
url: https://findedd.cn 
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true 
  field: site
  exclude: ''
hexo_case: 0
render_drafts: false
post_asset_folder: true 
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true 
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting 
index_generator:
  path: ''
  per_page: 10 
  order_by: -date 

# Category & Tag (分类与标签)
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format (时间格式)
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination (分页)
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:


theme: yun 



deploy:
  type: ''